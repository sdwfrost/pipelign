[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelign"
version = "0.1.0"
description = "A pipeline for automated multiple sequence alignment"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mukarram Hossain", email = "asmmh2@cam.ac.uk" },
]
dependencies = [
    "biopython>=1.86",
    "ete4>=4.4,<5",
    "joblib>=1.3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/asmmhossain/pipelign"
Repository = "https://github.com/asmmhossain/pipelign"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "build>=1",
    "twine>=5",
]

[project.scripts]
pipelign = "pipelign.cli:main"
gb2fas = "pipelign.gb2fas:main"
pipelign-doctor = "pipelign.doctor:main"

[tool.setuptools]
packages = ["pipelign"]
