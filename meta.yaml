package:
  name: pipelign
  version: "0.1.0"

#source:
#  git_rev: "v0.1"
#  git_url: https://github.com/sdwfrost/pipelign.git

requirements:
  host:
    - python >=3.10,<3.15
    - pip
    - setuptools >=69
    - wheel
  run:
    - python >=3.10,<3.15
    - biopython >=1.86
    - ete4 >=4.4,<5
    - joblib >=1.3
    - mafft
    - iqtree
    - hmmer
    - cd-hit
    - blast
    - parallel

about:
  home: https://github.com/asmmhossain/pipelign
  license: MIT
  license_file: LICENSE
